<!--
  React + Babel are loaded from a CDN for convenience. For an AIR-GAPPED / on-prem
  deploy with no internet, run  ./frontend/vendor_offline.sh  once to download
  react, react-dom and babel into ./frontend/vendor/, then switch the three <script>
  srcs below to  ./vendor/...  . Nothing else changes.
-->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0f1419; --panel:#161c24; --panel2:#1c242e; --line:#2a343f;
    --text:#e6edf3; --muted:#8b98a5; --accent:#2dd4bf; --accent2:#38bdf8;
    --warn:#f59e0b; --danger:#f87171; --ok:#34d399;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--accent2)}
  .wrap{max-width:1120px;margin:0 auto;padding:24px}
  header h1{margin:0;font-size:20px;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .banner{margin:14px 0 20px;padding:10px 14px;border:1px solid var(--line);
    border-left:3px solid var(--accent);background:var(--panel);border-radius:8px;
    font-size:13px;color:var(--muted)}
  .banner b{color:var(--text)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .card .v{font-size:24px;font-weight:600;margin-top:6px}
  .card .v small{font-size:13px;color:var(--muted);font-weight:400}
  .controls{display:flex;align-items:center;gap:16px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;flex-wrap:wrap}
  .controls label{font-size:13px;color:var(--muted)}
  .controls input[type=range]{accent-color:var(--accent);width:220px;vertical-align:middle}
  .pill{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
  .pill.tumor{color:#fca5a5;border-color:#5b2b2b;background:#2a1414}
  .pill.normal{color:#a7f3d0;border-color:#1f4d3d;background:#0f241d}
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
  tr:last-child td{border-bottom:none}
  tr.done{opacity:.5}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .thumb{width:52px;height:52px;border-radius:6px;border:1px solid var(--line);cursor:pointer;object-fit:cover}
  .confbar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;width:90px}
  .confbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .btn{font-size:12px;padding:6px 10px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.amend{border-color:#7a4a12;color:#fcd34d}
  .btn.confirm{border-color:#1f4d3d;color:#a7f3d0}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px}
  .tag.confirm_signout{background:#0f241d;color:#a7f3d0}
  .tag.amend{background:#2a1c0a;color:#fcd34d}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:420px;width:90%}
  .modal img{width:100%;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line)}
  .foot{color:var(--muted);font-size:12px;margin-top:22px;line-height:1.6}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);
    padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
  .tab.active{color:var(--text);border-color:var(--accent);background:var(--panel2)}
  .slidegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .slidecard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .slidecard.done{opacity:.55}
  .slidecard .heat{width:100%;display:block;cursor:pointer;image-rendering:pixelated;border-bottom:1px solid var(--line)}
  .scbody{padding:12px 14px}
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
